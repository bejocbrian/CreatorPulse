version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: creatorpulse-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: creatorpulse
    volumes:
      - mongodb_data:/data/db
    networks:
      - creatorpulse-network

networks:
  creatorpulse-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
